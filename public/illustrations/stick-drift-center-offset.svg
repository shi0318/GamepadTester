<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="drift-fig-title drift-fig-desc">
  <title id="drift-fig-title">How a stick drift reading is measured</title>
  <desc id="drift-fig-desc">A stick range circle with a calibrated center, a small detection threshold ring around it, and a resting stick position that sits outside the ring. The distance between the center and the resting position is the center offset.</desc>
  <rect width="960" height="480" rx="18" fill="#081017"/>
  <circle cx="820" cy="70" r="150" fill="#a5ed38" opacity=".05"/>
  <g font-family="DM Sans, Inter, Arial, sans-serif">
    <text x="48" y="64" fill="#a5ed38" font-size="15" font-weight="800" letter-spacing="3">STICK DRIFT READING</text>
    <text x="48" y="100" fill="#eaf2f4" font-size="30" font-weight="700">Offset at rest vs. the detection threshold</text>
  </g>
  <!-- stick range -->
  <g transform="translate(270 280)">
    <circle r="160" fill="#0d1a23" stroke="#1b3441" stroke-width="3"/>
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#1b3441" stroke-width="2"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#1b3441" stroke-width="2"/>
    <!-- threshold ring: 0.12 of full range -->
    <circle r="19.2" fill="#a5ed38" fill-opacity=".1" stroke="#a5ed38" stroke-width="2" stroke-dasharray="4 4"/>
    <circle r="4" fill="#a5ed38"/>
    <!-- resting point at roughly 0.2 offset -->
    <line x1="0" y1="0" x2="25" y2="-20" stroke="#ffb452" stroke-width="3" stroke-linecap="round"/>
    <circle cx="25" cy="-20" r="7" fill="#ffb452"/>
    <circle cx="25" cy="-20" r="14" fill="none" stroke="#ffb452" stroke-opacity=".35" stroke-width="2"/>
    <text x="0" y="190" fill="#7f96a3" font-family="DM Sans, Inter, Arial, sans-serif" font-size="15" text-anchor="middle">Full stick range (edge = 1.00)</text>
  </g>
  <!-- callouts -->
  <g font-family="DM Sans, Inter, Arial, sans-serif">
    <line x1="295" y1="260" x2="520" y2="190" stroke="#ffb452" stroke-width="1.5" stroke-dasharray="3 4"/>
    <line x1="270" y1="280" x2="520" y2="290" stroke="#a5ed38" stroke-width="1.5" stroke-dasharray="3 4"/>
    <line x1="285" y1="292" x2="520" y2="390" stroke="#7f96a3" stroke-width="1.5" stroke-dasharray="3 4"/>
    <circle cx="532" cy="186" r="6" fill="#ffb452"/>
    <text x="550" y="182" fill="#eaf2f4" font-size="19" font-weight="700">Resting position</text>
    <text x="550" y="206" fill="#b8cbd0" font-size="15">Where the stick reports while untouched</text>
    <circle cx="532" cy="290" r="6" fill="#a5ed38"/>
    <text x="550" y="286" fill="#eaf2f4" font-size="19" font-weight="700">Calibrated center</text>
    <text x="550" y="310" fill="#b8cbd0" font-size="15">Locked in when you click Calibrate center</text>
    <circle cx="532" cy="390" r="6" fill="none" stroke="#a5ed38" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="550" y="386" fill="#eaf2f4" font-size="19" font-weight="700">Detection threshold (0.12)</text>
    <text x="550" y="410" fill="#b8cbd0" font-size="15">A resting offset beyond this ring reads as DRIFT FOUND</text>
  </g>
</svg>
